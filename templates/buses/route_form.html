{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow border-0">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">{{ title }}</h4>
                </div>

                <div class="card-body">
                    <form method="POST">

                        {% csrf_token %}

                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                {{ field.label }}
                            </label>
                            {{ field }}

                            {{ field.errors }}
                        </div>

                        {% endfor %}
                        <button class="btn btn-danger">
                            Save Route
                        </button>
                        <a href="{% url 'route_list' %}" class="btn btn-secondary">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
